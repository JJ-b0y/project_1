<button
    class="px-4 py-3 text-[1.05em] text-nowrap font-extrabold border-bs-transparent cursor-pointer"
    [ngClass]="{
        whiteBgButton: buttonType() === 'white',
        orangeBgButton: buttonType() === 'orange',
        blueBgButton: buttonType() === 'blue',
    }"
    (click)="onClickHandler()"
>
    {{ buttonText() }}
</button>
