<div class="flex w-full min-h-68 items-center justify-start bg-primary-blue">
    <div class="flex flex-col g-x-pad gap-5 max-sm:gap-3 text-white">
        <span class="text-[#ffd0a6]! uppercase font-bold text-[12px] max-sm:text-[10px] tracking-[0.08em] mb-1.5">
            {{ heading }}
        </span>
        <h1 class="text-[48px] max-sm:text-[36px] mb-2 font-standout tracking-[-1.8px] leading-12 max-sm:leading-6 font-bold">
            {{ title }}
        </h1>
        <p class="max-w-180 max-sm:text-[.9em] text-[#E9F8FB] tracking-[0.08em] leading-6">
            {{ description }}
        </p>
    </div>
</div>
