<section class="block items-start w-full">
    <app-page-header
        [heading]="pageHeader.heading"
        [title]="pageHeader.title"
        [description]="pageHeader.description"
    />
    <div class="flex max-[890px]:flex-col gap-4 w-full bg-[linear-gradient(135deg,#fff_0%,#f4fbfd_70%,#e9f7fa_100%)]! g-x-pad py-16">
        <div class="flex flex-col gap-2 bg-white w-220 max-[370px]:w-70 max-[442px]:w-85 max-[648px]:w-100 max-[788px]:w-150 max-[962px]:w-180 h-80 p-6 rounded-2xl border border-card-border">
            <div class="grid bg-[#111] rounded-[14px] place-items-center aspect-video overflow-hidden">
                <div class="grid w-18 h-18 place-items-center text-[30px] text-white rounded-[50%] bg-primary-orange">▶</div>
            </div>
            <h2 class="font-semibold text-[18px] leading-[1.55] tracking-[0.02em] max-md:text-[14px]">
                How to Write a Systematic Literature Review
            </h2>
            <span class="text-fade">YRA Seminar Series · Practical Session</span>
        </div>
        <div class="flex flex-col gap-2 bg-white w-220 max-[370px]:w-70 max-[442px]:w-85 max-[648px]:w-100 max-[788px]:w-150 max-[962px]:w-180 h-80 p-6 rounded-2xl border border-card-border">
            <div class="grid bg-[#111] rounded-[14px] place-items-center aspect-video overflow-hidden">
                <div class="grid w-18 h-18 place-items-center text-[30px] text-white rounded-[50%] bg-primary-orange">▶</div>
            </div>
            <h2 class="font-semibold text-[18px] leading-[1.55] tracking-[0.02em] max-md:text-[14px]">
                Research Methodology Masterclass
            </h2>
            <span class="text-fade">YRA Training Archive</span>
        </div>
    </div>
</section>
